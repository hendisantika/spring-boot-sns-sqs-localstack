# Dependabot configuration
# Docs: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # Gradle dependencies, plugins & Gradle wrapper
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    assignees:
      - hendisantika
    labels:
      - dependencies
      - gradle
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: scope
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
          - "io.spring.dependency-management"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
      aws-sdk:
        patterns:
          - "com.amazonaws*"
          - "software.amazon.awssdk*"
      test:
        patterns:
          - "org.junit*"
          - "org.mockito*"
          - "org.assertj*"
          - "org.testcontainers*"

  # GitHub Actions used in workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    assignees:
      - hendisantika
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  # Docker images referenced in compose.yaml (LocalStack)
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    assignees:
      - hendisantika
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(docker)"
